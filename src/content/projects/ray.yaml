title: { en: Path tracer, fr: Path tracer }
summary:
  en: "A ray tracing engine written in C++ with acceleration structures, extended with global illumination and path tracing."
  fr: "Un moteur de lancer de rayons en C++ avec structures d'accélération, étendu à l'illumination globale et au path tracing."
description:
  en: |
    A rendering engine written in C++ during my engineering degree, in two parts.

    The first part implements the core of a ray tracer: a camera, geometric primitives (spheres, cubes, cylinders, cones, disks, triangles), meshes loaded from 3DS files, materials, textures, reflection and refraction, and a bounding volume hierarchy (BVH) that keeps rendering fast on large scenes.

    The second part adds global illumination with path tracing: area lights (disk, rectangle, sphere), light sampling, and quasi-random Sobol sequences to reduce noise.
  fr: |
    Un moteur de rendu écrit en C++ pendant mon cycle ingénieur, en deux parties.

    La première partie implémente le cœur d'un lanceur de rayons : une caméra, des primitives géométriques (sphères, cubes, cylindres, cônes, disques, triangles), des maillages chargés depuis des fichiers 3DS, des matériaux, des textures, la réflexion et la réfraction, et une hiérarchie de volumes englobants (BVH) qui garde le rendu rapide sur de grandes scènes.

    La seconde partie ajoute l'illumination globale par path tracing : sources de lumière surfaciques (disque, rectangle, sphère), échantillonnage des lumières et suites quasi aléatoires de Sobol pour réduire le bruit.
