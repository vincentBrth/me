title: { en: ASCII Art, fr: ASCII Art }
summary:
  en: "Turns any image into [ASCII art](https://en.wikipedia.org/wiki/ASCII_art). The portrait on the home page is a nod to it."
  fr: "Transforme n'importe quelle image en [ASCII art](https://fr.wikipedia.org/wiki/Art_ASCII). Le portrait de la page d'accueil y fait un clin d'œil."
description:
  en: |
    Small Python tool that turns an image, a video or the live webcam feed into ASCII art.

    The picture is converted to grayscale and resized to the chosen number of rows and columns; the brightness of each pixel then picks a character from a palette ordered from dense to light (a simple one, a detailed one, or one made of the letters of my name). The result is saved as a text file, or drawn as an image with the monospace font of your choice.
  fr: |
    Petit outil Python qui transforme une image, une vidéo ou le flux de la webcam en ASCII art.

    L'image est passée en niveaux de gris et redimensionnée au nombre de lignes et de colonnes choisi ; la luminosité de chaque pixel choisit ensuite un caractère dans une palette rangée du plus dense au plus clair (une simple, une détaillée, ou une faite des lettres de mon nom). Le résultat est enregistré en fichier texte, ou dessiné dans une image avec la police à chasse fixe de son choix.
cover: ../../assets/projects/ascii-art.webp
categories: [vision]
stack: [Python, OpenCV, Pillow]
year: '2020'
links:
  source: https://github.com/vincentBrth/AsciiArt
