title: { en: Ekko, fr: Ekko }
summary:
  en: "“Your view of the ocean.” My entrepreneurial project."
  fr: "« Votre regard sur l'océan. » Mon projet entrepreneurial."
description:
  en: |
    Ekko is my flagship project of the year, in which I try my hand at entrepreneurship by building a community app for ocean lovers, which I design and develop alone while surrounding myself with plenty of people to advise me.

    On the app, members share their experiences, identify species together and build a shared picture of marine life. Among the features: a species dex that works offline, community identification, sharing your pictures, meetups and much more to come.

    Under the hood: a Rust monorepo (Axum REST API, Apalis background jobs, PostgreSQL with PostGIS, Redis, S3 storage), an Expo / React Native app for Android, iOS and the web, and a Next.js website, all deployed with Docker. With the whole ops side behind it (Grafana, Loki, cAdvisor, etc.), and an MCP server that gives AI agents read-only access for development and moderation.
  fr: |
    Ekko, c'est mon projet phare de l'année où je m'essaie à l'entrepreneuriat en construisant une application communautaire pour les amoureux de l'océan, que je conçois et développe seul en m'entourant d'un tas de personnes pour me conseiller.

    Sur l'application, les membres partagent leurs expériences, identifient les espèces ensemble et construisent une image commune de la vie marine. Parmi les fonctionnalités : un dex des espèces consultable hors ligne, l'identification communautaire, le partage de vos images, des rencontres et bien d'autres à venir.

    Côté technique : un monorepo Rust (API REST Axum, tâches de fond Apalis, PostgreSQL avec PostGIS, Redis, stockage S3), une application Expo / React Native pour Android, iOS et le web, et un site Next.js, le tout déployé avec Docker. Avec tout le côté ops derrière (Grafana, Loki, cAdvisor, etc.), et un serveur MCP qui donne aux agents IA un accès en lecture seule pour le développement et la modération.
