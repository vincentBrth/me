title: { en: Family blog with Jekyll, fr: Blog familial avec Jekyll }
summary:
  en: "A small Jekyll site, fed with Markdown through the GitHub API, to easily share tips with my family during the lockdown."
  fr: "Un petit site Jekyll, alimenté en Markdown via l'API GitHub, pour partager facilement des astuces avec ma famille pendant le confinement."
description:
  en: |
    During the lockdown, a simple way to share tips with my family, without anyone having to learn how to run a website.

    Posts are written in Markdown and published to the repository through the GitHub API, then served by GitHub Pages with Jekyll. The site uses the Mediumish theme, and runs locally with Docker during development.
  fr: |
    Pendant le confinement, un moyen simple de partager des astuces avec ma famille, sans que personne ait à apprendre à gérer un site.

    Les articles sont écrits en Markdown et publiés dans le dépôt via l'API GitHub, puis servis par GitHub Pages avec Jekyll. Le site utilise le thème Mediumish, et tourne en local avec Docker pendant le développement.
cover: ../../assets/projects/jekyll.webp
categories: [web]
stack: [Jekyll, Markdown, JavaScript, Docker]
year: '2020'
links:
