title: { en: Cloud DVR at ATEME, fr: Cloud DVR chez ATEME }
summary:
  en: "Five years as an R&D engineer on a video delivery product used by major broadcasters: microservices architecture, quality and onboarding."
  fr: "Cinq ans comme ingénieur R&D sur un produit de diffusion vidéo utilisé par de grands diffuseurs : architecture microservices, qualité et intégration des nouveaux."
description:
  en: |
    From 2021 to 2026, I worked as an R&D engineer at [ATEME](https://www.ateme.com/), in Rennes, on an OTT and cloud DVR product: the part of the video chain that delivers channels over the internet and lets viewers record and replay programmes from the cloud. The product is used by broadcasters such as France TV, Canal+, Arte and Netflix.

    My main work:

    - **development** of the product, in a team, on software that has to stay reliable under load and at low latency;
    - **architecture** of a high-availability microservices solution;
    - **quality**: I was in charge of quality on the product;
    - **proxy manager**: organising the team's workflow and onboarding newcomers.
  fr: |
    De 2021 à 2026, j'ai travaillé comme ingénieur R&D chez [ATEME](https://www.ateme.com/), à Rennes, sur un produit OTT et cloud DVR : la partie de la chaîne vidéo qui diffuse les chaînes sur internet et permet aux téléspectateurs d'enregistrer et de revoir des programmes depuis le cloud. Le produit est utilisé par des diffuseurs comme France TV, Canal+, Arte ou Netflix.

    Mes principaux travaux :

    - le **développement** du produit, en équipe, sur un logiciel qui doit rester fiable sous la charge et à faible latence ;
    - l'**architecture** d'une solution microservices haute disponibilité ;
    - la **qualité** : j'encadrais la qualité du produit ;
    - le rôle de **proxy-manager** : organisation du workflow de l'équipe et intégration des nouveaux arrivants.
categories: [pro]
stack: [C/C++, Microservices, Cloud, OTT]
year: 2021 — 2026
