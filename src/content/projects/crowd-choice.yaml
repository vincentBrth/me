title: { en: Crowd Choice, fr: Crowd Choice }
summary:
  en: "A one-week startup challenge with IGR-IAE Rennes, building a crowdfunded event company from scratch."
  fr: "Un défi startup d'une semaine avec l'IGR-IAE Rennes, pour monter de zéro une entreprise événementielle financée par la foule."
description:
  en: |
    A one-week training course in partnership with IGR-IAE Rennes whose goal was to create a startup with all the constraints of entrepreneurship.

    Crowd Choice is an event company based on participative financing: themed evenings (music styles, foreign cultures) are designed from community surveys, then submitted to crowdfunding.
  fr: |
    Une formation d'une semaine en partenariat avec l'IGR-IAE Rennes dont l'objectif était de créer une startup avec toutes les contraintes de l'entrepreneuriat.

    Crowd Choice est une entreprise événementielle basée sur le financement participatif : des soirées à thème (styles musicaux, cultures étrangères) sont conçues à partir de sondages auprès de la communauté, dans les grandes villes de Bretagne, puis soumises à un crowdfunding.
