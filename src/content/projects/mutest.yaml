summary:
  en: "4-month internship in automated test equipment (ATE): validation procedures for electronic components, FPGA and embedded systems programming."
  fr: "Stage de 4 mois dans le test automatisé (ATE) : procédures de validation de composants électroniques, programmation de FPGA et de systèmes embarqués."
description:
  en: |
    A 4-month internship as a software developer and electronic tester at [Mu-Test](http://www.mu-test.com/), in Saint-Just-Malmont, a company working on Automated Test Equipment (ATE).

    I improved and trialled validation procedures for electronic components, and programmed FPGAs and embedded systems. The archive contains my internship report (in French).
  fr: |
    Un stage de 4 mois comme développeur logiciel et testeur électronique chez [Mu-Test](http://www.mu-test.com/), à Saint-Just-Malmont, entreprise du domaine de l'ATE (Automated Test Equipment).

    J'ai amélioré et expérimenté des procédures de validation de composants électroniques, et programmé des FPGA et des systèmes embarqués. L'archive contient mon rapport de stage.
