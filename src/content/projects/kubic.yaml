description:
  en: |
    The game was designed for desktop: streaming assets are [not available in Unity WebGL builds](https://docs.unity3d.com/ScriptReference/Application-streamingAssetsPath.html), so options and sounds are missing in the browser. Use the [Windows build](https://github.com/vincentBrth/Kubic/tree/master/Kubic/Windows) for the full experience.

    More details are available in the GitHub README.
  fr: |
    Le jeu a été conçu pour ordinateur : les streaming assets [ne sont pas disponibles en WebGL avec Unity](https://docs.unity3d.com/ScriptReference/Application-streamingAssetsPath.html), donc les options et les sons manquent dans le navigateur. Utilisez la [version Windows](https://github.com/vincentBrth/Kubic/tree/master/Kubic/Windows) pour l'expérience complète.

    Plus de détails dans le README du dépôt GitHub.
