title: { en: Kubic, fr: Kubic }
summary:
  en: "A Unity game built to explore NavMesh-based AI navigation."
  fr: "Un jeu Unity conçu pour explorer la navigation d'IA par NavMesh."
description:
  en: |
    A Unity game made to learn the NavMesh system, which lets AI agents find their way through a 3D level.

    It has three levels with different gameplay: enemies that chase the player across the map, a third-person level, and a level built around moving cubes. It also comes with a menu, options and highscores.

    The game was designed for desktop: streaming assets are [not available in Unity WebGL builds](https://docs.unity3d.com/ScriptReference/Application-streamingAssetsPath.html), so options and sounds are missing in the browser. Use the [Windows build](https://github.com/vincentBrth/Kubic/tree/master/Kubic/Windows) for the full experience.
  fr: |
    Un jeu Unity réalisé pour apprendre le système NavMesh, qui permet à des agents IA de trouver leur chemin dans un niveau 3D.

    Il compte trois niveaux au gameplay différent : des ennemis qui poursuivent le joueur sur la carte, un niveau à la troisième personne, et un niveau construit autour de cubes mobiles. Il propose aussi un menu, des options et des highscores.

    Le jeu a été conçu pour ordinateur : les streaming assets [ne sont pas disponibles en WebGL avec Unity](https://docs.unity3d.com/ScriptReference/Application-streamingAssetsPath.html), donc les options et les sons manquent dans le navigateur. Utilisez la [version Windows](https://github.com/vincentBrth/Kubic/tree/master/Kubic/Windows) pour l'expérience complète.
